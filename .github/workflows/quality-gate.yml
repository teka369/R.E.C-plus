name: quality-gate

on:
  pull_request:
  push:
    branches: [main]

jobs:
  backend-lint-and-unit:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: r.e.c-backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: r.e.c-backend/package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: npm run test:unit

  backend-integration:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: r.e.c-backend
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_DB: recedu_test
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd="pg_isready -U postgres"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=10
    env:
      DATABASE_URL_TEST: postgresql://postgres:postgres@localhost:5432/recedu_test?schema=public
      DATABASE_URL: postgresql://postgres:postgres@localhost:5432/recedu_test?schema=public
      JWT_SECRET: ci-jwt-secret
      NODE_ENV: test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: r.e.c-backend/package-lock.json
      - run: npm ci
      - run: npx prisma migrate deploy
      - run: npm run test:integration

  backend-e2e:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: r.e.c-backend
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_DB: recedu_test
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd="pg_isready -U postgres"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=10
    env:
      DATABASE_URL_TEST: postgresql://postgres:postgres@localhost:5432/recedu_test?schema=public
      DATABASE_URL: postgresql://postgres:postgres@localhost:5432/recedu_test?schema=public
      JWT_SECRET: ci-jwt-secret
      NODE_ENV: test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: r.e.c-backend/package-lock.json
      - run: npm ci
      - run: npx prisma migrate deploy
      - run: npm run test:e2e

  backend-build:
    runs-on: ubuntu-latest
    needs: [backend-lint-and-unit, backend-integration, backend-e2e]
    defaults:
      run:
        working-directory: r.e.c-backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: r.e.c-backend/package-lock.json
      - run: npm ci
      - run: npm run build

  frontend-lint-and-e2e:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: r.e.c-frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: r.e.c-frontend/package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: npm run build
      - run: npx playwright install --with-deps chromium
      - run: npm run test:e2e

  deploy:
    runs-on: ubuntu-latest
    needs: [backend-build, frontend-lint-and-e2e]
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    steps:
      - name: Validate Coolify deploy secrets
        env:
          COOLIFY_DEPLOY_WEBHOOK_URL: ${{ secrets.COOLIFY_DEPLOY_WEBHOOK_URL }}
        run: |
          if [ -z "$COOLIFY_DEPLOY_WEBHOOK_URL" ]; then
            echo "::error::Missing GitHub secret COOLIFY_DEPLOY_WEBHOOK_URL"
            exit 1
          fi

      - name: Trigger Coolify deployment
        env:
          COOLIFY_DEPLOY_WEBHOOK_URL: ${{ secrets.COOLIFY_DEPLOY_WEBHOOK_URL }}
          COOLIFY_DEPLOY_WEBHOOK_TOKEN: ${{ secrets.COOLIFY_DEPLOY_WEBHOOK_TOKEN }}
        run: |
          set -euo pipefail

          PAYLOAD=$(printf '{"ref":"%s","sha":"%s","repository":"%s","workflow":"quality-gate"}' \
            "${GITHUB_REF_NAME}" "${GITHUB_SHA}" "${GITHUB_REPOSITORY}")

          if [ -n "${COOLIFY_DEPLOY_WEBHOOK_TOKEN:-}" ]; then
            HTTP_CODE=$(curl -sS -o coolify-response.json -w "%{http_code}" \
              -X POST \
              -H "Content-Type: application/json" \
              -H "Authorization: Bearer ${COOLIFY_DEPLOY_WEBHOOK_TOKEN}" \
              -d "${PAYLOAD}" \
              "${COOLIFY_DEPLOY_WEBHOOK_URL}")
          else
            HTTP_CODE=$(curl -sS -o coolify-response.json -w "%{http_code}" \
              -X POST \
              -H "Content-Type: application/json" \
              -d "${PAYLOAD}" \
              "${COOLIFY_DEPLOY_WEBHOOK_URL}")
          fi

          cat coolify-response.json || true

          if [ "${HTTP_CODE}" -lt 200 ] || [ "${HTTP_CODE}" -ge 300 ]; then
            echo "::error::Coolify deploy trigger failed with HTTP ${HTTP_CODE}"
            exit 1
          fi

          echo "Coolify deployment triggered successfully (HTTP ${HTTP_CODE})."
