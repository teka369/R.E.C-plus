name: quality-gate

on:
  pull_request:
  push:
    branches: [main]

jobs:
  backend-lint-and-unit:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: r.e.c-backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: r.e.c-backend/package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: npm run test:unit

  backend-integration:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: r.e.c-backend
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_DB: recedu_test
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd="pg_isready -U postgres"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=10
    env:
      DATABASE_URL_TEST: postgresql://postgres:postgres@localhost:5432/recedu_test?schema=public
      DATABASE_URL: postgresql://postgres:postgres@localhost:5432/recedu_test?schema=public
      JWT_SECRET: ci-jwt-secret
      NODE_ENV: test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: r.e.c-backend/package-lock.json
      - run: npm ci
      - run: npx prisma migrate deploy
      - run: npm run test:integration

  backend-build:
    runs-on: ubuntu-latest
    needs: [backend-lint-and-unit, backend-integration]
    defaults:
      run:
        working-directory: r.e.c-backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: r.e.c-backend/package-lock.json
      - run: npm ci
      - run: npm run build

  frontend-lint-and-e2e:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: r.e.c-frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: r.e.c-frontend/package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: npx playwright install --with-deps chromium
      - run: npm run test:e2e

  deploy:
    runs-on: ubuntu-latest
    needs: [backend-build, frontend-lint-and-e2e]
    if: github.ref == 'refs/heads/main'
    steps:
      - uses: actions/checkout@v4
      - name: Deploy placeholder
        run: |
          echo "All quality gates passed."
          echo "Connect your deployment command here (Coolify, SSH, or container registry push)."
