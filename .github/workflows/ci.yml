name: CI Pipeline

on:
  push:
    branches: [main, hardening/**, work/audit-recovery, security/**]
  pull_request:
    branches: [main]

jobs:
  secret-guard:
    name: Secret guard (Node script)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 26
      - name: Block tracked secrets and uploads
        run: node scripts/check-tracked-secrets.mjs

  # ──────────────────────────────────────────────
  # Stage 0 — Secretos y uploads fuera del índice
  # ──────────────────────────────────────────────
  secrets-and-uploads:
    name: Tracked secrets and uploads guard
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Reject tracked secrets and user uploads
        run: bash scripts/check-tracked-secrets.sh

  # ──────────────────────────────────────────────
  # Stage 1 — Lint
  # ──────────────────────────────────────────────
  lint:
    name: Lint
    needs: secret-guard
    runs-on: ubuntu-latest
    strategy:
      matrix:
        include:
          - app: r.e.c-backend
            lint-script: lint
          - app: r.e.c-frontend
            lint-script: lint
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 26

      - name: Cache node_modules (${{ matrix.app }})
        uses: actions/cache@v4
        with:
          path: ${{ matrix.app }}/node_modules
          key: ${{ runner.os }}-node-${{ matrix.app }}-${{ hashFiles(format('{0}/package-lock.json', matrix.app)) }}
          restore-keys: |
            ${{ runner.os }}-node-${{ matrix.app }}-

      - name: Install dependencies
        working-directory: ${{ matrix.app }}
        run: npm ci

      - name: Generate Prisma client
        if: matrix.app == 'r.e.c-backend'
        working-directory: r.e.c-backend
        env:
          DATABASE_URL: postgresql://postgres:postgres@localhost:5432/dummy
          DATABASE_DIRECT_URL: postgresql://postgres:postgres@localhost:5432/dummy
        run: npx prisma generate

      - name: Validate Prisma schema
        if: matrix.app == 'r.e.c-backend'
        working-directory: r.e.c-backend
        env:
          DATABASE_URL: postgresql://postgres:postgres@localhost:5432/dummy
          DATABASE_DIRECT_URL: postgresql://postgres:postgres@localhost:5432/dummy
        run: npx prisma validate

      - name: Run linter
        working-directory: ${{ matrix.app }}
        run: npm run ${{ matrix.lint-script }}

      - name: Build
        working-directory: ${{ matrix.app }}
        env:
          DATABASE_URL: postgresql://postgres:postgres@localhost:5432/dummy
          DATABASE_DIRECT_URL: postgresql://postgres:postgres@localhost:5432/dummy
          JWT_SECRET: ci-jwt-secret-at-least-32-characters-long
          JWT_REFRESH_SECRET: ci-refresh-secret-at-least-32-chars
          JWT_ISSUER: recedu-ci
          JWT_AUDIENCE: recedu-ci
          NEXT_PUBLIC_API_BASE_URL: http://127.0.0.1:4000
          INTERNAL_API_URL: http://127.0.0.1:4000
          NEXT_PUBLIC_SITE_URL: http://127.0.0.1:3000
          NEXT_PUBLIC_EMAIL_DOMAIN: example.edu.co
        run: npm run build

  # ──────────────────────────────────────────────
  # Stage 2 — Unit Tests (backend)
  # ──────────────────────────────────────────────
  unit-tests:
    name: Unit Tests
    needs: lint
    runs-on: ubuntu-latest
    env:
      DATABASE_URL: postgresql://localhost:5432/dummy
      DATABASE_DIRECT_URL: postgresql://localhost:5432/dummy
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 26

      - name: Cache node_modules (backend)
        uses: actions/cache@v4
        with:
          path: r.e.c-backend/node_modules
          key: ${{ runner.os }}-node-r.e.c-backend-${{ hashFiles('r.e.c-backend/package-lock.json') }}
          restore-keys: |
            ${{ runner.os }}-node-r.e.c-backend-

      - name: Install dependencies
        working-directory: r.e.c-backend
        run: npm ci

      - name: Generate Prisma client
        working-directory: r.e.c-backend
        run: npx prisma generate

      - name: Run unit tests with coverage
        working-directory: r.e.c-backend
        run: npm run test:cov

      - name: Check line coverage >= 50%
        working-directory: r.e.c-backend
        run: |
          if [ ! -f coverage/unit/coverage-summary.json ]; then
            echo "coverage-summary.json not found — failing instead of skipping"
            exit 1
          fi
          COVERAGE=$(node -p "require('./coverage/unit/coverage-summary.json').total.lines.pct")
          echo "Line coverage: ${COVERAGE}%"
          node -e "if (${COVERAGE} < 50) { console.error('Coverage ${COVERAGE}% is below 50% threshold'); process.exit(1); }"

      - name: Upload coverage report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: backend-coverage-report
          path: r.e.c-backend/coverage/unit/
          retention-days: 14

  # ──────────────────────────────────────────────
  # Stage 3 — Integration Tests (backend)
  # ──────────────────────────────────────────────
  integration-tests:
    name: Integration Tests
    needs: unit-tests
    runs-on: ubuntu-latest
    timeout-minutes: 20
    services:
      postgres:
        image: postgres:15
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: recedu_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd="pg_isready -U postgres"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=5
      redis:
        image: redis:7
        ports:
          - 6379:6379
        options: >-
          --health-cmd="redis-cli ping"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=5
    env:
      NODE_ENV: test
      # Solo el Postgres del job. Nunca secrets.DATABASE_URL (podría ser producción).
      DATABASE_URL: postgresql://postgres:postgres@localhost:5432/recedu_test?schema=public
      DATABASE_DIRECT_URL: postgresql://postgres:postgres@localhost:5432/recedu_test?schema=public
      DATABASE_URL_TEST: postgresql://postgres:postgres@localhost:5432/recedu_test?schema=public
      REDIS_URL: redis://localhost:6379
      JWT_SECRET: ci-jwt-secret-at-least-32-characters-long
      JWT_ISSUER: recedu-ci
      JWT_AUDIENCE: recedu-ci
      RESEND_API_KEY: re_test_dummy_key_for_ci
      JWT_REFRESH_SECRET: ci-refresh-secret-at-least-32-chars
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 26

      - name: Cache node_modules (backend)
        uses: actions/cache@v4
        with:
          path: r.e.c-backend/node_modules
          key: ${{ runner.os }}-node-r.e.c-backend-${{ hashFiles('r.e.c-backend/package-lock.json') }}
          restore-keys: |
            ${{ runner.os }}-node-r.e.c-backend-

      - name: Install dependencies
        working-directory: r.e.c-backend
        run: npm ci

      - name: Remove local .env files (use CI env vars only)
        working-directory: r.e.c-backend
        run: rm -f .env .env.test

      - name: Generate Prisma client
        working-directory: r.e.c-backend
        run: npx prisma generate

      - name: Run Prisma migrations
        working-directory: r.e.c-backend
        run: npx prisma migrate deploy

      - name: Run integration tests
        working-directory: r.e.c-backend
        run: npm run test:integration

  # ──────────────────────────────────────────────
  # Stage 4 — E2E desechable (Nest + Playwright)
  # ──────────────────────────────────────────────
  e2e:
    name: E2E
    needs: lint
    runs-on: ubuntu-latest
    timeout-minutes: 40
    services:
      postgres:
        image: postgres:15
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: recedu_e2e
        ports:
          - 5432:5432
        options: >-
          --health-cmd="pg_isready -U postgres"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=5
      redis:
        image: redis:7
        ports:
          - 6379:6379
        options: >-
          --health-cmd="redis-cli ping"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=5
    env:
      E2E_DATABASE: "1"
      DATABASE_URL: postgresql://postgres:postgres@localhost:5432/recedu_e2e?schema=public
      DATABASE_DIRECT_URL: postgresql://postgres:postgres@localhost:5432/recedu_e2e?schema=public
      REDIS_URL: redis://localhost:6379
      JWT_SECRET: ci-jwt-secret-at-least-32-characters-long
      JWT_ISSUER: recedu-ci
      JWT_AUDIENCE: recedu-ci
      JWT_REFRESH_SECRET: ci-refresh-secret-at-least-32-chars
      RESEND_API_KEY: re_test_dummy_key_for_ci
      CI: "true"
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 26

      - name: Cache node_modules
        uses: actions/cache@v4
        with:
          path: |
            r.e.c-backend/node_modules
            r.e.c-frontend/node_modules
          key: ${{ runner.os }}-e2e-${{ hashFiles('r.e.c-backend/package-lock.json', 'r.e.c-frontend/package-lock.json') }}

      - name: Install backend
        working-directory: r.e.c-backend
        run: npm ci

      - name: Install frontend
        working-directory: r.e.c-frontend
        run: npm ci

      - name: Remove local env files
        run: rm -f r.e.c-backend/.env r.e.c-backend/.env.test r.e.c-frontend/.env r.e.c-frontend/.env.local

      - name: Install Playwright Chromium
        working-directory: r.e.c-frontend
        run: npx playwright install --with-deps chromium

      - name: Run disposable E2E
        run: bash scripts/run-disposable-e2e.sh

      - name: Upload Playwright diagnostics
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-e2e
          path: |
            r.e.c-frontend/playwright-report
            r.e.c-frontend/test-results
          retention-days: 7
