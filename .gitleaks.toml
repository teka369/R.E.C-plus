[allowlist]
description = "Valores de ejemplo, CI y documentacion sin secretos reales"
regexes = [
  '''ci-jwt-secret-at-least-32-characters-long''',
  '''ci-refresh-secret-at-least-32-chars''',
  '''re_test_dummy_key_for_ci''',
  '''abc123def456''',
  '''CHANGE_ME_WITH_[A-Z_]+''',
  '''http://127\.0\.0\.1:4000''',
]
paths = [
  '''\.env\.example$''',
  '''\.env\.production\.example$''',
  '''\.env\.docker\.example$''',
  '''r\.e\.c-backend/README\.md$''',
]
