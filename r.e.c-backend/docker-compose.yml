# Postgres y Redis locales. No exponen puertos fuera de la máquina.
# Copia .env.docker.example a .env.docker y ejecuta:
#   docker compose --env-file .env.docker up -d
# Solo Redis: docker compose up -d redis
#
# DATABASE_URL=postgresql://...@127.0.0.1:5432/...
# REDIS_URL=redis://127.0.0.1:6379

services:
  redis:
    image: redis:7-alpine
    container_name: redis_rec
    restart: unless-stopped
    ports:
      - "127.0.0.1:6379:6379"
    command: redis-server --appendonly yes
    volumes:
      - redis-rec-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 3s
      retries: 5

  postgres:
    image: postgres:16-alpine
    container_name: postgres_rec
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      # Valor por defecto permite `docker compose up -d redis` sin .env.docker; en prod usa --env-file .env.docker
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-change_me_set_in_env_docker}
      POSTGRES_DB: ${POSTGRES_DB:-rec_db}
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - postgres-rec-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-postgres} -d ${POSTGRES_DB:-rec_db}"]
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  postgres-rec-data:
  redis-rec-data:
